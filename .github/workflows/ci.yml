name: CI

on:
  push: { branches: [main, develop] }
  pull_request:

jobs:
  test:
    # Windows exercises the primary supported filesystem behavior.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[all,dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[all,dev]"
      - run: mypy

  licences:
    # Keep copyleft dependencies from entering transitively.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[all]" pip-licenses
      - name: Fail on copyleft dependencies
        run: |
          pip-licenses --from=mixed --format=csv --with-urls > licences.csv
          cat licences.csv
          if grep -Ei '(^|,)"?(GNU )?(A?GPL|LGPL)' licences.csv; then
            echo "::error::A copyleft dependency was introduced."
            exit 1
          fi
      - name: Publish the resolved license inventory
        uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: licences.csv
