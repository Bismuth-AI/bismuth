name: CI

on:
  # develop is where day-to-day work lands, so it has to be gated too. Gating
  # only main would mean a release is the first time anything gets checked.
  push: { branches: [main, develop] }
  pull_request:

jobs:
  test:
    # One platform, and it is Windows on purpose. Bismuth's job is paths --
    # reserved device names, case-insensitivity, cp949 consoles, symlinks that
    # need Developer Mode -- and every one of those is a Windows-only bug, on the
    # OS the primary users are running. A green Linux build would prove very
    # little here. Python 3.11 is the floor declared in pyproject.toml; testing
    # the floor is what catches syntax and stdlib that only exist further up.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      # agentkit lives in this repo and is imported as an installed library, not
      # vendored, so it has to be installed alongside -- it is not a dependency
      # of the wheel and pip will not find it on its own.
      - run: pip install -e ./packages/agentkit -e ".[parsers,server,dev]"
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: pytest -q
      # No API key anywhere in this file. The whole engine runs against a scripted
      # model, so CI exercises placement, refusal and undo for free -- and cannot
      # start silently passing because someone's credentials expired.

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ./packages/agentkit -e ".[parsers,server,dev]"
      - run: mypy

  licences:
    # Keep copyleft dependencies from entering transitively.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[parsers,server]" pip-licenses
      - name: Fail on copyleft dependencies
        run: |
          pip-licenses --from=mixed --format=csv > licences.csv
          cat licences.csv
          if grep -Ei '(^|,)"?(GNU )?(A?GPL|LGPL)' licences.csv; then
            echo "::error::A copyleft dependency was introduced."
            exit 1
          fi
