[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# A standalone library: no dependency on bismuth (enforced by a test). Slated for
# separate publication; bismuth installs and imports it. The name may change before
# a public release to avoid a PyPI clash.
name = "agentkit"
version = "0.1.0"
description = "A minimal, framework-free tool-using agent loop."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "The Bismuth authors" }]
keywords = ["agent", "llm", "tools", "tool-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["pydantic>=2.7,<3"]  # MIT

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["agentkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentkit"]
